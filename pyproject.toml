[project]
name = "git-secret-recovery"
version = "0.1.0"
description = "Recover secrets that Git history and object storage still remember."
readme = "README.md"
authors = [
    { name = "mahdi lakhzouri", email = "mahdi.lakhzouri@esprit.tn" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
git-secret-recovery = "git_secret_recovery.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S311", "S603"]  # fake fixture secrets are intentional
